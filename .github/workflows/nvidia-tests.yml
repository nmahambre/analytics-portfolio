name: NVIDIA analysis tests

on:
  push:
    paths:
      - "nvidia-peer-analysis/**"
      - ".github/workflows/nvidia-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nvidia-peer-analysis

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install numpy pandas pytest

      - name: Run unit tests
        run: python -m pytest -q tests/
